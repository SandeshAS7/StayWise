spring.application.name=staywise

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/staywise?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:staywise_app}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${STAYWISE_DB_PASSWORD:staywise_password}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true
spring.data.web.pageable.page-serialization-mode=via-dto

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

logging.level.org.flywaydb=INFO
logging.level.org.springframework.boot.autoconfigure.flyway=INFO
logging.level.com.staywise=DEBUG
